# Render blueprint: OncoFlow backend API + PostgreSQL.
# Deploy: push to GitHub, then in Render "New > Blueprint" and point at this repo.
# Set the secret env vars (Meta WhatsApp, Sarvam) in the Render dashboard after creation.
services:
  - type: web
    name: oncoflow-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oncoflow-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false          # set to your Vercel URL, e.g. https://oncoflow.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CRON_SECRET
        generateValue: true

  # Daily autonomous AI check-ins: calls the guarded cron endpoint so linked
  # patients who are due get a proactive message without anyone clicking.
  - type: cron
    name: oncoflow-checkins
    runtime: python
    rootDir: server
    plan: free
    schedule: "30 3 * * *"        # 09:00 IST daily (03:30 UTC)
    buildCommand: "pip install -r requirements.txt"
    startCommand: >-
      curl -fsS -X POST "$API_BASE_URL/api/messages/run-checkins/cron"
      -H "X-Cron-Key: $CRON_SECRET"
    envVars:
      - key: API_BASE_URL
        sync: false              # your API URL, e.g. https://oncoflow-api.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: oncoflow-api
          envVarKey: CRON_SECRET

databases:
  - name: oncoflow-db
    plan: free
