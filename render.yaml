# Render blueprint: OncoFlow backend API + PostgreSQL.
# Deploy: push to GitHub, then in Render "New > Blueprint" and point at this repo.
# Set the secret env vars (Meta WhatsApp, Sarvam) in the Render dashboard after creation.
services:
  - type: web
    name: oncoflow-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oncoflow-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false          # set to your Vercel URL, e.g. https://oncoflow.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: SARVAM_API_KEY
        sync: false

databases:
  - name: oncoflow-db
    plan: free
